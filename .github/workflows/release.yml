name: Publish packages to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm test

      # OIDC trusted publishing needs a recent npm CLI
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      # Tokenless: npm exchanges the workflow's OIDC token with the registry
      # (trusted publisher config on each package), provenance automatic.
      # pnpm pack converts workspace:* deps to real versions; already-published
      # versions are skipped so re-runs are safe.
      - name: Publish (OIDC trusted publishing)
        run: |
          set -euo pipefail
          for dir in packages/protocol packages/sdk packages/server packages/mcp packages/cli packages/mesh; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "skip $name@$version (already on registry)"
              continue
            fi
            echo "publishing $name@$version"
            (cd "$dir" && rm -f ./*.tgz && pnpm pack && npm publish ./*.tgz --access public)
          done
