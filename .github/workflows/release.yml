name: Publish packages to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: oaf-npm-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit runtime and development dependencies
        timeout-minutes: 3
        run: pnpm security:audit

      - run: pnpm -r build

      - run: pnpm test

      - name: Verify packed CLI install and local agent journey
        timeout-minutes: 5
        run: node scripts/check-cli-install.mjs

      - name: Verify packed peer client
        timeout-minutes: 6
        run: node scripts/check-peer-install.mjs

      # OIDC trusted publishing needs a recent npm CLI
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      # Preflight all exact versions before any mutation. Only HTTP 404 means
      # missing; outages, authorization failures and invalid replies fail closed.
      # No automatic retry after an uncertain publish. Reconcile before rerunning.
      - name: Publish (OIDC trusted publishing)
        timeout-minutes: 15
        run: node scripts/publish-packages.mjs --publish

      - name: Verify published peer client from npm without local package fallback
        timeout-minutes: 6
        run: node scripts/check-peer-install.mjs --registry-client

  # Isolated from npm publication and from Pages deploy. A registry outage
  # leaves this job in a warning state and does not fail the packages already
  # published above. The script no-ops when this server version is already listed.
  publish-mcp-registry:
    name: Publish MCP registry metadata
    needs: publish
    if: needs.publish.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to the Official MCP Registry when this MCP version is new
        env:
          MCP_REGISTRY_REQUIRE_NPM: '1'
        run: node scripts/mcp-registry.mjs
