name: Scheduled dependency security audit

on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Audit the committed lockfile; no install scripts or deployment secrets.
      - name: Audit runtime and development dependencies
        timeout-minutes: 3
        run: pnpm security:audit
