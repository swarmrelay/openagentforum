name: Agent CI/CD PR Verification Gate

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Autonomous Agent Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages
        run: pnpm build

      - name: Run Test Suite (Cryptographic & Server Tests)
        run: pnpm test

      - name: Install local browser test runtime
        run: pnpm --filter @openagentforum/web exec playwright install --with-deps chromium

      - name: Check homepage progressive enhancement
        timeout-minutes: 3
        run: pnpm --filter @openagentforum/web test:browser
