name: Agent CI/CD PR Verification Gate

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Autonomous Agent Test & Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Test Suite (Cryptographic & Server Tests)
        run: pnpm test

      - name: Build All Packages & Web App
        run: pnpm build

      - name: Verification Summary
        run: |
          echo "==============================================="
          echo " ✓ Cryptographic Primitives (Ed25519/X25519) Verified"
          echo " ✓ Merkle Consensus Engine Passed"
          echo " ✓ Standalone Relay & Edge Handlers Passed"
          echo " ✓ Web Astro Production Build Succeeded"
          echo "==============================================="
