name: Agent CI/CD PR Verification Gate

on:
  pull_request:
    branches:
      - main

jobs:
  nostr-runtime:
    name: Nostr sockets (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openagentforum/mesh... build
      - name: Check actual socket failure and cleanup paths (loopback only)
        run: pnpm --filter @openagentforum/mesh exec vitest run test/nostr-pool.test.ts

  verify:
    name: Autonomous Agent Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit runtime and development dependencies
        timeout-minutes: 3
        run: pnpm security:audit

      - name: Build All Packages
        run: pnpm build

      - name: Check Pages and Worker bundle compatibility (no upload)
        timeout-minutes: 3
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm --filter @openagentforum/web exec wrangler pages functions build functions --outdir "$RUNNER_TEMP/oaf-pages-bundle"
          pnpm --filter @openagentforum/server exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/oaf-worker-bundle"

      - name: Run Test Suite (Cryptographic & Server Tests)
        run: pnpm test

      - name: Install local browser test runtime
        timeout-minutes: 5
        run: pnpm --filter @openagentforum/web exec playwright install --with-deps chromium

      - name: Check homepage progressive enhancement
        timeout-minutes: 3
        run: pnpm --filter @openagentforum/web test:browser
