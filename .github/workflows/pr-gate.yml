name: Agent CI/CD PR Verification Gate

on: pull_request

jobs:
  nostr-runtime:
    name: Nostr sockets (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openagentforum/mesh... build
      - name: Check actual socket failure and cleanup paths (loopback only)
        run: pnpm --filter @openagentforum/mesh exec vitest run test/nostr-pool.test.ts

  verify:
    name: Autonomous Agent Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit runtime and development dependencies
        timeout-minutes: 3
        run: pnpm security:audit

      - name: Build All Packages
        run: pnpm build

      - name: Check Pages and Worker bundle compatibility (no upload)
        timeout-minutes: 3
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm --filter @openagentforum/web exec wrangler pages functions build functions --outdir "$RUNNER_TEMP/oaf-pages-bundle"
          pnpm --filter @openagentforum/server exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/oaf-worker-bundle"

      - name: Run Test Suite (Cryptographic & Server Tests)
        run: pnpm test

      - name: Verify clean CLI install without the native SQLite toolchain
        timeout-minutes: 5
        run: node scripts/check-cli-install.mjs

      - name: Verify installed peer client and encrypted loopback setup
        timeout-minutes: 6
        run: node scripts/check-peer-install.mjs

      - name: Install local browser test runtime
        timeout-minutes: 12
        run: pnpm --filter @openagentforum/web exec playwright install --with-deps chromium

      - name: Check homepage progressive enhancement
        timeout-minutes: 3
        run: pnpm --filter @openagentforum/web test:browser

  mcp-docker:
    name: MCP image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # The change filter diffs against the PR base, so the merge base has to be fetched.
          fetch-depth: 0

      - name: Detect changes under packages/mcp
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD -- packages/mcp | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes under packages/mcp; skipping the image build."
          fi

      # Guards the failure #451 came from: a Dockerfile that stops building at all.
      # The default context uses this checkout's version and falls back to npm latest
      # with a warning, so this runs without needing a pinned MCP_VERSION.
      - name: Build the image
        if: steps.changed.outputs.run == 'true'
        run: docker build -t openagentforum-mcp packages/mcp

      # The image entrypoint is a stdio server, so `--help` is not a safe smoke test:
      # it reads stdin and would sit there until the job timeout. Assert the built
      # entrypoint exists inside the image instead, which fails loudly if `npm install`
      # resolved nothing, then do one bounded start to prove the interpreter runs.
      - name: Check the built entrypoint is present in the image
        if: steps.changed.outputs.run == 'true'
        run: |
          docker run --rm --entrypoint node openagentforum-mcp \
            -e "require('node:fs').accessSync('node_modules/@openagentforum/mcp/dist/bin.js')"

      - name: Start the server once under a timeout
        if: steps.changed.outputs.run == 'true'
        run: |
          # A stdio server with no stdin exits or blocks; either way it must not crash
          # on load. 124 means the timeout fired, which is an acceptable start.
          set +e
          timeout 15 docker run --rm -i openagentforum-mcp </dev/null
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "server exited with $code"
            exit 1
          fi
          echo "server started (exit $code)"
